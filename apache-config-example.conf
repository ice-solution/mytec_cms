# Apache 虛擬主機配置範例 - Cloudflare 版本
# 將此配置放在 /etc/apache2/sites-available/ 目錄下

# HTTP 虛擬主機（Cloudflare 代理）
<VirtualHost *:80>
    ServerName mytec-cms.sth-tech.com
    ServerAdmin webmaster@sth-tech.com
    DocumentRoot /var/www/mytec_cms/cms-frontend/build
    
    # 信任 Cloudflare 代理
    # 允許來自 Cloudflare 的請求
    RemoteIPHeader CF-Connecting-IP
    RemoteIPInternalProxy 173.245.48.0/20
    RemoteIPInternalProxy 103.21.244.0/22
    RemoteIPInternalProxy 103.22.200.0/22
    RemoteIPInternalProxy 103.31.4.0/22
    RemoteIPInternalProxy 141.101.64.0/18
    RemoteIPInternalProxy 108.162.192.0/18
    RemoteIPInternalProxy 190.93.240.0/20
    RemoteIPInternalProxy 188.114.96.0/20
    RemoteIPInternalProxy 197.234.240.0/22
    RemoteIPInternalProxy 198.41.128.0/17
    RemoteIPInternalProxy 162.158.0.0/15
    RemoteIPInternalProxy 104.16.0.0/13
    RemoteIPInternalProxy 104.24.0.0/14
    RemoteIPInternalProxy 172.64.0.0/13
    RemoteIPInternalProxy 131.0.72.0/22
    
    # 日誌配置
    ErrorLog ${APACHE_LOG_DIR}/mytec-cms-error.log
    CustomLog ${APACHE_LOG_DIR}/mytec-cms-access.log combined
    
    # 目錄配置
    <Directory /var/www/mytec_cms/cms-frontend/build>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        
        # 啟用重寫模組
        RewriteEngine On
        
        # 處理 React Router 路由
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>
    
    # 靜態資源快取
    <LocationMatch "\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$">
        ExpiresActive On
        ExpiresDefault "access plus 1 year"
        Header append Cache-Control "public"
    </LocationMatch>
    
    # HTML 文件不快取
    <LocationMatch "\.html$">
        ExpiresActive On
        ExpiresDefault "access plus 0 seconds"
        Header set Cache-Control "no-cache, no-store, must-revalidate"
        Header set Pragma "no-cache"
        Header set Expires 0
    </LocationMatch>
</VirtualHost>

# HTTPS 虛擬主機（可選，用於直接訪問）
<VirtualHost *:443>
    ServerName mytec-cms.sth-tech.com
    ServerAdmin webmaster@sth-tech.com
    DocumentRoot /var/www/mytec_cms/cms-frontend/build
    
    # SSL 配置（如果使用自簽憑證或 Let's Encrypt）
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key
    
    # 日誌配置
    ErrorLog ${APACHE_LOG_DIR}/mytec-cms-error.log
    CustomLog ${APACHE_LOG_DIR}/mytec-cms-access.log combined
    
    # 目錄配置
    <Directory /var/www/mytec_cms/cms-frontend/build>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        
        # 啟用重寫模組
        RewriteEngine On
        
        # 處理 React Router 路由
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>
    
    # 靜態資源快取
    <LocationMatch "\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$">
        ExpiresActive On
        ExpiresDefault "access plus 1 year"
        Header append Cache-Control "public"
    </LocationMatch>
    
    # HTML 文件不快取
    <LocationMatch "\.html$">
        ExpiresActive On
        ExpiresDefault "access plus 0 seconds"
        Header set Cache-Control "no-cache, no-store, must-revalidate"
        Header set Pragma "no-cache"
        Header set Expires 0
    </LocationMatch>
</VirtualHost>
